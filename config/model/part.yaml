_target_: experiments.tagging.wrappers.ParTWrapper
in_channels: null
out_channels: null
use_amp: true
zeropad: true
canonicalize_boost: true
compile: true
compile_kwargs:
 dynamic: true
 mode: default
compile_framesnet: true

net:
 _target_: lloca.backbone.particletransformer.ParticleTransformer
 _partial_: true
 size: 0

 input_dim: null
 num_classes: null

 attn_reps: "${model.net.helpers.s_channels}x0n+${model.net.helpers.v_channels}x1n"
 num_heads: ${eval:'int(round(2 ** (3 + (${model.net.size} // 2))))'}
 pair_embed_dims:
  - ${model.net.helpers.pair_dim}
  - ${model.net.helpers.pair_dim}
  - ${model.net.helpers.pair_dim}
 num_layers: ${eval:'int(round(3 * 2 ** ((${model.net.size}+3)/2)))'}
 num_cls_layers: 0
 include_global_token: true
 helpers:
  s_channels: ${eval:'int(round(2 ** (${model.net.size}+6)/${model.net.num_heads}))'}
  v_channels: ${eval:'int(round(2 ** (${model.net.size}+4)/${model.net.num_heads}))'}
  hidden_dims: ${eval:'int(round(2 ** (${model.net.size}+7)))'}
  pair_dim: ${eval:'int(round(2 ** (${model.net.size}+6)))'}

 ffn_ratio: 2
 embed_dims: []
 use_plain_embed: true
 trim: false

 use_pre_activation_pair: false
 normalize_input: true
 pair_input_dim: 4
 version: 3

 checkpoint_blocks: false

defaults:
 - framesnet: identity
