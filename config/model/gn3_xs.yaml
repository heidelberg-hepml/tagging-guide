global_object: &global_object jets # name of global variable

net:
  init_nets:
    - input_name: tracks
      dense_config:
        input_size: ${model.in_channels}
        output_size: &embed_dim 32
        hidden_layers: [32]
        activation: &activation SiLU
      variables:
        - tracks: []
        - *global_object : []
      global_object: ${model.global_object}
      attach_global: false
  encoder:
    embed_dim: *embed_dim
    out_dim: *embed_dim
    num_layers: 4
    attn_kwargs:
      num_heads: 4
  pool_net:
    input_size: *embed_dim
  tasks:
    modules:
      - _target_: salt.models.ClassificationTask
        name: jets_classification # name of the task
        input_name: ${model.global_object}
        class_names: [qcd]
        label: null
        use_class_dict: true
        loss: torch.nn.CrossEntropyLoss # not used
        dense_config:
          input_size: *embed_dim
          output_size: ${model.out_channels}
          hidden_layers: [32]
          activation: *activation

defaults:
  - gn3_m
