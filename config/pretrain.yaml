exp_type: pretrain
exp_name: pretrain_local

data:
 canonicalize: beam_eta
 canonicalize_spurions: false
 data_dir: data/pretrain
 dataset_name: pretrain
 num_workers: 8
 prefetch_factor: 4
 slab_events: 512    # events per contiguous h5 read (sequential I/O unit)
 buffer_mb: 256      # per-worker shuffle buffer; #files mixed per batch scales with this
 val_frac: 0.1
 test_frac: 0.1
 use_scalars: false

evaluation:
 eval_set: [test]

defaults:
 - training: jc_transformer
 - tagging
 - _self_
