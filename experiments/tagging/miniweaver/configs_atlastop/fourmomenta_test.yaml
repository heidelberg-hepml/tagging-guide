selection: null
   ### use `&`, `|`, `~` for logical operations on numpy arrays
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression

new_variables:
   ### [format] name: formula
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   training_weights: np.ones_like(label_isQCD)
   fjet_clus_E_GeV: fjet_clus_E * 1e-3
   fjet_clus_px_GeV: fjet_clus_px * 1e-3
   fjet_clus_py_GeV: fjet_clus_py * 1e-3
   fjet_clus_pz_GeV: fjet_clus_pz * 1e-3

inputs:
   pf_vectors:
      length: 128
      pad_mode: constant
      vars:
         - [fjet_clus_E_GeV, null]
         - [fjet_clus_px_GeV, null]
         - [fjet_clus_py_GeV, null]
         - [fjet_clus_pz_GeV, null]

   ev_weights:
      length: 1
      pad_mode: constant
      vars:
         - [training_weights, null]

   shower_weights:
      ### 27 per-event Pythia weights; eval-only, used for ISR/FSR scale systematic uncertainties
      length: 27
      pad_mode: constant
      vars:
         - [EventInfo_mcEventWeights, null]

labels:
   ### type can be `simple`, `custom`
   ### [option 1] use `simple` for binary/multi-class classification, then `value` is a list of 0-1 labels
   type: simple
   value: [label_isQCD, label_isTop]
   ### [option 2] otherwise use `custom` to define the label, then `value` is a map
   # type: custom
   # value:
   #    truth_label: label.argmax(1)
